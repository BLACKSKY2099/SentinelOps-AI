name: SentinelOps-AI CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # 🐍 Job 1: Verify Python Agent & Running Tests
  python-agent-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip' # caches pip dependencies automatically

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -s requirements.txt ]; then
          pip install -r requirements.txt
        else
          pip install boto3 botocore pytest
        fi

    - name: Run Python Unit Tests
      run: |
        python -m unittest discover -s tests

  # 🎨 Job 2: Verify React Dashboard Compilation
  react-dashboard-build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: dashboard/package-lock.json

    - name: Install NPM Dependencies
      run: |
        cd dashboard
        npm ci

    - name: Run Build Compiler
      run: |
        cd dashboard
        npm run build

  # 🐳 Job 3: Verify Docker Container Compilation
  docker-compile-verify:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: actions/setup-buildx-action@v3

    - name: Verify Python Agent Docker Build
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile
        push: false # only verify building, do not push
        tags: sentinelops-agent:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Verify React Dashboard Docker Build
      uses: docker/build-push-action@v5
      with:
        context: ./dashboard
        file: ./dashboard/Dockerfile
        push: false # only verify building, do not push
        tags: sentinelops-dashboard:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
