name: SentinelOps-AI Docker CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # 🎨 Frontend React & Build Check
  frontend-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: |
          cd dashboard
          npm ci

      - name: Run compilation
        run: |
          cd dashboard
          npm run build

  # 🐳 Docker Builds & Testing Gate
  docker-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Agent Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: sentinelops-agent:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Dashboard Nginx Container
        uses: docker/build-push-action@v5
        with:
          context: ./dashboard
          file: ./dashboard/Dockerfile
          push: false
          tags: sentinelops-dashboard:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Execute Tests inside Container
        run: |
          docker run --rm sentinelops-agent:latest
