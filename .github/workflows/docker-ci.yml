name: SentinelOps-AI Docker CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  # 🎨 Frontend React & Build Check
  frontend-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: |
          cd dashboard
          npm ci

      - name: Run compilation
        run: |
          cd dashboard
          npm run build

  # 🐳 Docker Builds, Testing Gate & Publish
  docker-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lower case owner name
        run: |
          echo "IMAGE_OWNER_LOWER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Agent Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ghcr.io/${{ env.IMAGE_OWNER_LOWER }}/sentinelops-agent:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Dashboard Nginx Container
        uses: docker/build-push-action@v5
        with:
          context: ./dashboard
          file: ./dashboard/Dockerfile
          push: false
          load: true
          tags: ghcr.io/${{ env.IMAGE_OWNER_LOWER }}/sentinelops-dashboard:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Execute Tests inside Container
        run: |
          docker run --rm ghcr.io/${{ env.IMAGE_OWNER_LOWER }}/sentinelops-agent:latest

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Agent Container to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/${{ env.IMAGE_OWNER_LOWER }}/sentinelops-agent:latest

      - name: Publish Dashboard Container to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/${{ env.IMAGE_OWNER_LOWER }}/sentinelops-dashboard:latest
